<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffc2d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Per Te ❤️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ── Registered custom properties for smooth transitions ── */
    @property --bg-1 { syntax: '<color>'; inherits: false; initial-value: #ffe0ec; }
    @property --bg-2 { syntax: '<color>'; inherits: false; initial-value: #ffc2d4; }
    @property --bg-3 { syntax: '<color>'; inherits: false; initial-value: #ffb3c6; }

    :root {
      --pink-deep: #c9184a;
      --pink-mid: #e63970;
      --pink-light: #ff85a8;
      --pink-pale: #ffc2d4;
      --pink-cloud: #ffe0ec;
      --pink-glow: rgba(230, 57, 112, 0.4);
      --white-glass: rgba(255, 255, 255, 0.88);
      --radius-card: 28px;
      --radius-btn: 50px;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --bg-1: #ffe0ec;
      --bg-2: #ffc2d4;
      --bg-3: #ffb3c6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', system-ui, sans-serif;
      position: relative;
      padding: var(--safe-top) 0 var(--safe-bottom);
    }

    /* ── Animated gradient background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-1));
      background-size: 300% 300%;
      animation: gradientShift 12s ease infinite;
      transition: --bg-1 0.8s, --bg-2 0.8s, --bg-3 0.8s;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Floating hearts (CSS-only) ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .hearts-bg span {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      color: var(--pink-mid);
      will-change: transform, opacity;
      animation: floatHeart linear infinite;
    }

    @keyframes floatHeart {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.28; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-105vh) rotate(270deg); opacity: 0; }
    }

    /* ── Fireflies / Stars ── */
    .fireflies {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .firefly {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 240, 200, 0.9);
      box-shadow: 0 0 6px 2px rgba(255, 240, 200, 0.6), 0 0 14px 5px rgba(255, 200, 150, 0.25);
      will-change: transform, opacity;
      animation: fireflyDrift linear infinite, fireflyGlow ease-in-out infinite;
    }

    @keyframes fireflyDrift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(var(--dx1), var(--dy1)); }
      50%  { transform: translate(var(--dx2), var(--dy2)); }
      75%  { transform: translate(var(--dx3), var(--dy3)); }
      100% { transform: translate(0, 0); }
    }

    @keyframes fireflyGlow {
      0%, 100% { opacity: 0.15; }
      50%  { opacity: 0.8; }
    }

    /* ── Sparkle particles ── */
    .sparkle-container {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-card);
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 4px 1px rgba(255,255,255,0.9), 0 0 8px 3px rgba(255,133,168,0.35);
      pointer-events: none;
      animation: sparkleAnim 1s ease-out forwards;
    }

    @keyframes sparkleAnim {
      0%   { transform: scale(0); opacity: 1; }
      50%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 2;
      background: var(--white-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 133, 168, 0.3);
      border-radius: var(--radius-card);
      padding: 36px 24px 32px;
      width: min(88vw, 380px);
      text-align: center;
      box-shadow:
        0 24px 48px rgba(180, 60, 100, 0.15),
        0 4px 12px rgba(180, 60, 100, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transition: transform 0.4s var(--ease-smooth), box-shadow 0.4s;
      opacity: 1;
      transform-style: preserve-3d;
    }

    .card.entering {
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      animation: cardEntrance 0.8s var(--ease-bounce) 0.3s forwards;
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card.shake {
      animation: shake 0.45s var(--ease-smooth);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      15%  { transform: translateX(-6px) rotate(-1.5deg); }
      30%  { transform: translateX(6px) rotate(1.5deg); }
      50%  { transform: translateX(-4px) rotate(-0.8deg); }
      70%  { transform: translateX(4px) rotate(0.8deg); }
      85%  { transform: translateX(-2px) rotate(-0.3deg); }
    }

    /* ── Question ── */
    .question {
      position: relative;
      z-index: 1;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 700;
      color: var(--pink-deep);
      line-height: 1.25;
      margin-bottom: 20px;
      min-height: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      text-shadow: 0 2px 8px rgba(201, 24, 74, 0.15);
    }

    .question.typing::after {
      content: '|';
      display: inline-block;
      margin-left: 2px;
      animation: blink 0.5s step-end infinite;
      color: var(--pink-mid);
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ── Illustration ── */
    .illustration {
      position: relative;
      z-index: 1;
      margin-bottom: 24px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: opacity 0.35s, transform 0.45s var(--ease-bounce);
    }

    .illustration.switching {
      opacity: 0;
      transform: scale(0.8) rotate(-5deg);
    }

    .illustration .scene {
      font-size: clamp(64px, 18vw, 86px);
      display: inline-block;
      animation: gentleBob 2.4s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-6px) scale(1.03); }
    }

    .illustration .sub-emoji {
      font-size: clamp(22px, 6vw, 30px);
      display: block;
      margin-top: 2px;
      opacity: 0.85;
    }

    /* ── Buttons container ── */
    .buttons {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    /* ── Shared button styles ── */
    .btn {
      border: none;
      border-radius: var(--radius-btn);
      font-family: 'Nunito', system-ui, sans-serif;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
      outline: none;
      transition:
        transform 0.25s var(--ease-bounce),
        box-shadow 0.25s var(--ease-smooth),
        background 0.25s,
        padding 0.35s var(--ease-smooth),
        opacity 0.3s;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--rx, 50%) var(--ry, 50%), rgba(255,255,255,0.45) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .btn:active::before { opacity: 1; }

    /* ── YES button ── */
    .btn-yes {
      background: linear-gradient(135deg, var(--pink-mid), var(--pink-deep));
      color: #fff;
      font-size: clamp(18px, 5vw, 22px);
      padding: 16px 56px;
      min-height: 54px;
      min-width: 180px;
      letter-spacing: 0.3px;
      box-shadow:
        0 6px 20px var(--pink-glow),
        0 2px 6px rgba(201, 24, 74, 0.2);
      z-index: 1;
      animation: breathe 2.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 6px 20px var(--pink-glow), 0 2px 6px rgba(201,24,74,0.2); }
      50%  { box-shadow: 0 6px 30px var(--pink-glow), 0 2px 8px rgba(201,24,74,0.3), 0 0 calc(var(--breathe-glow, 0) * 1px) var(--pink-light); }
    }

    .btn-yes:active {
      transform: scale(0.94) !important;
      box-shadow: 0 2px 10px var(--pink-glow);
    }

    .btn-yes .glow {
      position: absolute;
      inset: -3px;
      border-radius: var(--radius-btn);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      background: conic-gradient(from 0deg, transparent 0%, var(--pink-light) 25%, transparent 50%, var(--pink-mid) 75%, transparent 100%);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      padding: 2.5px;
    }

    .btn-yes .glow.on {
      opacity: 1;
      animation: glowSpin 2.5s linear infinite;
    }

    @keyframes glowSpin { to { transform: rotate(360deg); } }

    .btn-yes.pulse {
      animation: yesPulse 0.5s var(--ease-bounce);
    }

    @keyframes yesPulse {
      0%   { transform: scale(var(--yes-scale, 1)); }
      40%  { transform: scale(calc(var(--yes-scale, 1) * 1.1)); }
      100% { transform: scale(var(--yes-scale, 1)); }
    }

    /* ── NO button ── */
    .btn-no {
      background: rgba(201, 24, 74, 0.08);
      color: #b06078;
      font-size: clamp(14px, 3.8vw, 16px);
      padding: 12px 44px;
      min-height: 46px;
      font-weight: 700;
      transition:
        transform 0.35s var(--ease-bounce),
        box-shadow 0.25s,
        background 0.25s,
        padding 0.35s var(--ease-smooth),
        opacity 0.3s,
        font-size 0.35s;
    }

    .btn-no:active {
      transform: scale(0.92);
      background: rgba(201, 24, 74, 0.14);
    }

    .btn-no.poof {
      animation: poof 0.55s var(--ease-smooth) forwards;
    }

    @keyframes poof {
      0%   { transform: scale(1) rotate(0); opacity: 1; }
      40%  { transform: scale(1.15) rotate(6deg); opacity: 0.6; }
      100% { transform: scale(0) rotate(25deg); opacity: 0; }
    }

    /* ── No counter badge ── */
    .no-counter {
      font-size: 13px;
      color: var(--pink-mid);
      opacity: 0;
      margin-top: 4px;
      transition: opacity 0.4s;
      min-height: 20px;
    }

    .no-counter.visible {
      opacity: 1;
      animation: fadeSlideUp 0.4s var(--ease-bounce);
    }

    /* ── Emoji rain drops ── */
    .drop {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      font-size: 22px;
      will-change: transform, opacity;
      animation: emojiDrop 1.3s ease-in forwards;
    }

    @keyframes emojiDrop {
      0%   { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(92vh) rotate(300deg); opacity: 0; }
    }

    /* ── FLASH overlay on Yes ── */
    .flash {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    .flash.bang {
      animation: flashBang 0.5s ease-out forwards;
    }

    @keyframes flashBang {
      0%   { opacity: 0.95; }
      100% { opacity: 0; }
    }

    /* ── VIDEO OVERLAY ── */
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .video-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .video-overlay video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    .video-overlay .video-msg {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      padding: 32px 24px calc(32px + var(--safe-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 1.2s, transform 0.6s var(--ease-bounce) 1.2s;
    }

    .video-overlay.active .video-msg {
      opacity: 1;
      transform: translateY(0);
    }

    .video-msg h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(28px, 7.5vw, 40px);
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      margin-bottom: 6px;
    }

    .video-msg p {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(15px, 4vw, 18px);
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
      line-height: 1.45;
    }

    .video-msg .infinity {
      display: inline-block;
      margin-top: 12px;
      font-size: clamp(12px, 3.2vw, 14px);
      opacity: 0.75;
      color: #fff;
      animation: fadeSlideUp 0.6s ease 2s both;
    }

    .video-msg .btn-gallery {
      margin-top: 16px;
      animation: fadeSlideUp 0.6s ease 2.5s both;
    }

    /* ── SUCCESS SCREEN ── */
    .success-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .success-screen .bg-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, var(--pink-cloud), var(--pink-pale), #ffb3c6);
    }

    .success-screen.active {
      opacity: 1;
      pointer-events: all;
    }

    .success-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px;
      transform: scale(0.7);
      opacity: 0;
      transition: transform 0.7s var(--ease-bounce) 0.3s, opacity 0.5s ease 0.3s;
    }

    .success-screen.active .success-content {
      transform: scale(1);
      opacity: 1;
    }

    .success-heart {
      font-size: clamp(80px, 22vw, 110px);
      display: inline-block;
      animation: heartbeat 1.1s ease-in-out infinite;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%  { transform: scale(1.18); }
      28%  { transform: scale(0.98); }
      42%  { transform: scale(1.12); }
      56%  { transform: scale(1); }
    }

    .success-heart.mega-pulse {
      animation: megaPulse 0.6s var(--ease-bounce);
    }

    @keyframes megaPulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.35) rotate(10deg); }
      60%  { transform: scale(0.9) rotate(-5deg); }
      100% { transform: scale(1) rotate(0); }
    }

    .success-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 700;
      color: var(--pink-deep);
      margin: 16px 0 10px;
      animation: fadeSlideUp 0.6s ease 0.6s both;
    }

    .success-subtitle {
      font-size: clamp(16px, 4.5vw, 19px);
      color: #d44a6a;
      line-height: 1.55;
      animation: fadeSlideUp 0.6s ease 0.95s both;
    }

    .success-subtitle .dedication {
      display: block;
      margin-top: 8px;
      font-size: clamp(13px, 3.5vw, 15px);
      opacity: 0.7;
      font-style: italic;
    }

    .success-subtitle .infinity {
      display: inline-block;
      margin-top: 14px;
      font-size: clamp(13px, 3.5vw, 15px);
      opacity: 0.65;
      animation: fadeSlideUp 0.6s ease 1.4s both;
    }

    .success-content .btn-gallery {
      animation: fadeSlideUp 0.6s ease 1.8s both;
    }

    /* ── Easter egg message ── */
    .easter-msg {
      margin-top: 16px;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(18px, 5vw, 22px);
      color: var(--pink-deep);
      opacity: 0;
      transform: translateY(12px) scale(0.9);
      transition: opacity 0.6s ease, transform 0.6s var(--ease-bounce);
      pointer-events: none;
    }

    .easter-msg.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Gallery button (shared) ── */
    .btn-gallery {
      display: none;
      border: none;
      border-radius: var(--radius-btn);
      font-family: 'Nunito', system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(14px, 3.8vw, 16px);
      padding: 12px 32px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s, transform 0.25s var(--ease-bounce);
    }

    .success-content .btn-gallery {
      background: rgba(201, 24, 74, 0.12);
      color: var(--pink-deep);
      border-color: rgba(201, 24, 74, 0.15);
    }

    .btn-gallery:active {
      transform: scale(0.94);
    }

    /* ── Gallery overlay ── */
    .gallery-overlay {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(10, 10, 10, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .gallery-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .gallery-close {
      position: absolute;
      top: calc(16px + var(--safe-top));
      right: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 22px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s;
    }

    .gallery-close:active {
      background: rgba(255, 255, 255, 0.25);
    }

    .gallery-track {
      display: flex;
      width: 100%;
      height: 72vh;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .gallery-track::-webkit-scrollbar { display: none; }

    .gallery-slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .gallery-slide img {
      max-width: 88%;
      max-height: 80%;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .gallery-slide .caption {
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Dancing Script', cursive;
      font-size: clamp(16px, 4.5vw, 20px);
      margin-top: 16px;
      text-align: center;
      padding: 0 16px;
    }

    .gallery-dots {
      display: flex;
      gap: 8px;
      padding: 16px;
    }

    .gallery-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: none;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s, transform 0.3s;
    }

    .gallery-dot.active {
      background: var(--pink-light);
      transform: scale(1.4);
    }

    /* ── Music toggle ── */
    .music-toggle {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 20px;
      z-index: 350;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      transition: background 0.3s, transform 0.25s var(--ease-bounce);
    }

    .music-toggle:active {
      transform: scale(0.88);
    }

    .music-toggle.playing {
      animation: musicPulse 2s ease-in-out infinite;
    }

    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
      50%  { box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 0 16px rgba(255,133,168,0.4); }
    }

    /* ── Confetti + burst canvas ── */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 300;
      pointer-events: none;
    }

    /* ── A11y ── */
    .btn:focus-visible,
    .gallery-close:focus-visible,
    .music-toggle:focus-visible {
      outline: 3px solid var(--pink-mid);
      outline-offset: 3px;
    }

    /* ── Landscape ── */
    @media (max-height: 500px) {
      .card { padding: 20px 20px 18px; }
      .illustration { min-height: 70px; margin-bottom: 14px; }
      .question { min-height: auto; margin-bottom: 12px; font-size: clamp(22px, 5vw, 28px); }
      .illustration .scene { font-size: clamp(48px, 14vw, 64px); }
      .btn-yes { padding: 12px 44px; min-height: 46px; }
      .btn-no { padding: 10px 36px; min-height: 38px; }
    }
  </style>
</head>

<!-- Confetti + burst canvas -->

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════
     SEZIONE PERSONALIZZABILE
     Modifica qui sotto per personalizzare il sito!
     ══════════════════════════════════════════════════════ */

  /* Foto per la galleria — aggiungi le tue foto qui */
  var GALLERY_PHOTOS = [
    // { src: 'foto1.jpg', caption: 'Il nostro primo incontro ❤️' },
    // { src: 'foto2.jpg', caption: 'Quella volta al mare 🌊' },
    // { src: 'foto3.jpg', caption: 'Il nostro anniversario 🥂' },
    // { src: 'foto4.jpg', caption: 'Sempre insieme 💕' },
    // { src: 'foto5.jpg', caption: 'Ti amo 💖' },
  ];

  /* Messaggio segreto easter egg (tap 5 volte sul cuoricione) */
  var EASTER_EGG_MSG = 'Ps: ti amo più di quanto le parole possano dire 💝';

  /* File musicale di sottofondo */
  var MUSIC_FILE = 'music.mp3';

  /* ══════════════════════════════════════════════════════ */

  /* ────────────────── STAGE DATA ────────────────── */
  var STAGES = [
    { q: 'Vuoi essere la mia Valentina? ❤️',            s: '💑',        e: '💝', no: 'greveee' },
    { q: 'Sicura sicura bebesita? 🥹',                  s: '🥺💔',      e: '😢', no: 'Ehm... no' },
    { q: 'Dai ripensaci bambolina... 🥺',               s: '🧸💐',      e: '🙏', no: 'No, dai...' },
    { q: 'Ti prego...tibidada! 🥺',                     s: '😭🙏',      e: '💕', no: 'Noo...' },
    { q: 'Non mi arrendo, ultima chance cherry! 💪❤️',   s: '🧎‍♂️💍',     e: '✨', no: '...' },
    { q: "L'unica risposta è SÌ! 😏💖",                  s: '🎉💖',     e: '✅', no: null },
  ];

  var SAD_EMOJIS = ['💔', '😢', '🥺', '😿', '💧'];

  var NO_MSGS = [
    '',
    'Sul serio?! 😤',
    'Hai detto no 2 volte... 😤',
    'Ancora?! Già 3... 🥺',
    '4 no?! Cuore di pietra! 💔',
    'Ok, non hai scelta! 😏',
  ];

  var BG_STAGES = [
    ['#ffe0ec', '#ffc2d4', '#ffb3c6'],
    ['#ffc9dd', '#ffa8c0', '#ff8eb0'],
    ['#ffb0cc', '#ff85a8', '#ff6b9d'],
    ['#ff99bb', '#ff5c8d', '#ff3377'],
    ['#ff7799', '#ff3366', '#e6194a'],
    ['#ffd6e0', '#ffaac6', '#ff80ab'],
  ];

  /* ────────────────── DOM REFS ────────────────── */
  var $ = function (id) { return document.getElementById(id); };
  var card            = $('card');
  var questionEl      = $('question');
  var illusEl         = $('illustration');
  var btnYes          = $('btnYes');
  var btnNo           = $('btnNo');
  var glow            = $('glow');
  var noCounter       = $('noCounter');
  var bgEl            = $('bg');
  var flashEl         = $('flash');
  var videoOverlay    = $('videoOverlay');
  var heroVideo       = $('heroVideo');
  var successScr      = $('successScreen');
  var successHeart    = $('successHeart');
  var easterMsg       = $('easterMsg');
  var confettiCvs     = $('confetti');
  var sparkleContainer = $('sparkleContainer');
  var firefliesEl     = $('fireflies');
  var galleryOverlay  = $('galleryOverlay');
  var galleryTrack    = $('galleryTrack');
  var galleryDots     = $('galleryDots');
  var galleryClose    = $('galleryClose');
  var btnGalleryVideo = $('btnGalleryVideo');
  var btnGallerySuccess = $('btnGallerySuccess');
  var musicToggle     = $('musicToggle');
  var bgMusic         = $('bgMusic');

  var noCount = 0;
  var done    = false;

  /* ────────────────── WEB AUDIO — SOUND EFFECTS ────────────────── */
  var audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playPop() {
    try {
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(500, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }

  function playChime() {
    try {
      var ctx = getAudioCtx();
      var notes = [523, 659, 784, 1047];
      for (var i = 0; i < notes.length; i++) {
        (function (freq, delay) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.18, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.4);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.4);
        })(notes[i], i * 0.1);
      }
    } catch (e) {}
  }

  /* ────────────────── RIPPLE TRACKING ────────────────── */
  function trackPointer(e) {
    var btn = e.currentTarget;
    var r = btn.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX);
    var cy = (e.touches ? e.touches[0].clientY : e.clientY);
    btn.style.setProperty('--rx', ((cx - r.left) / r.width * 100) + '%');
    btn.style.setProperty('--ry', ((cy - r.top) / r.height * 100) + '%');
  }
  btnYes.addEventListener('pointerdown', trackPointer);
  btnNo.addEventListener('pointerdown', trackPointer);

  /* ────────────────── CARD ENTRANCE ────────────────── */
  card.addEventListener('animationend', function (e) {
    if (e.animationName === 'cardEntrance') {
      card.classList.remove('entering');
    }
  });

  /* ────────────────── GYROSCOPE TILT ────────────────── */
  function initGyro() {
    function onOrientation(e) {
      var g = e.gamma || 0;
      var b = e.beta  || 0;
      var tiltY = Math.max(-5, Math.min(5, g * 0.12));
      var tiltX = Math.max(-5, Math.min(5, (b - 45) * 0.1));
      card.style.transform = 'perspective(800px) rotateX(' + (-tiltX) + 'deg) rotateY(' + tiltY + 'deg)';
    }

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      document.addEventListener('click', function reqGyro() {
        DeviceOrientationEvent.requestPermission()
          .then(function (state) {
            if (state === 'granted') window.addEventListener('deviceorientation', onOrientation);
          })
          .catch(function () {});
        document.removeEventListener('click', reqGyro);
      }, { once: true });
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      window.addEventListener('deviceorientation', onOrientation);
    }
  }
  initGyro();

  /* ────────────────── TYPEWRITER ────────────────── */
  function typewrite(text, cb) {
    questionEl.textContent = '';
    questionEl.classList.add('typing');
    var i = 0;
    function next() {
      if (i < text.length) {
        questionEl.textContent += text[i++];
        setTimeout(next, 30 + Math.random() * 20);
      } else {
        questionEl.classList.remove('typing');
        if (cb) cb();
      }
    }
    next();
  }

  /* ────────────────── BACKGROUND EVOLUTION ────────────────── */
  function evolveBg(idx) {
    var c = BG_STAGES[Math.min(idx, BG_STAGES.length - 1)];
    bgEl.style.setProperty('--bg-1', c[0]);
    bgEl.style.setProperty('--bg-2', c[1]);
    bgEl.style.setProperty('--bg-3', c[2]);
  }

  /* ────────────────── SHARED DRAW HEART (canvas) ────────────────── */
  function drawHeart(ctx, x, y, sz, color, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle * Math.PI / 180);
    ctx.fillStyle = color;
    ctx.beginPath();
    var s = sz * 0.5;
    ctx.moveTo(0, s * 0.4);
    ctx.bezierCurveTo(-s, -s * 0.5, -s * 2, s * 0.3, 0, s * 1.5);
    ctx.bezierCurveTo(s * 2, s * 0.3, s, -s * 0.5, 0, s * 0.4);
    ctx.fill();
    ctx.restore();
  }

  /* ────────────────── HANDLE YES ────────────────── */
  btnYes.addEventListener('click', handleYes);

  function handleYes() {
    if (done) return;
    done = true;
    stopSparkles();

    /* Sound */
    playChime();

    if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 80]);

    /* Flash */
    flashEl.classList.add('bang');

    /* Heart burst */
    launchBurst();

    /* Start video immediately (user gesture context for unmuting) */
    heroVideo.muted = false;
    heroVideo.volume = 0;
    heroVideo.load();
    var playPromise = heroVideo.play();

    /* After flash, show video or fallback */
    setTimeout(function () {
      if (playPromise && playPromise.then) {
        playPromise.then(function () {
          showVideo();
        }).catch(showFallback);
      } else {
        showFallback();
      }
    }, 300);
  }

  function showVideo() {
    videoOverlay.classList.add('active');
    /* Fade in audio */
    heroVideo.volume = 1;
    setTimeout(launchConfetti, 400);
    startMusic();
  }

  function showFallback() {
    heroVideo.pause();
    heroVideo.removeAttribute('src');
    heroVideo.load();
    successScr.classList.add('active');
    setTimeout(launchConfetti, 400);
    startMusic();
  }

  /* Video error listener */
  heroVideo.addEventListener('error', function () {
    if (done) showFallback();
  });

  /* ────────────────── HANDLE NO ────────────────── */
  btnNo.addEventListener('click', handleNo);

  function handleNo() {
    if (done) return;
    noCount++;

    var idx = Math.min(noCount, STAGES.length - 1);
    var st  = STAGES[idx];

    /* Sound + haptic */
    playPop();
    if (navigator.vibrate) navigator.vibrate(30 + noCount * 20);

    /* Shake card */
    replayAnim(card, 'shake');

    /* Sad emoji rain */
    spawnDrops();

    /* Pulse yes */
    replayAnim(btnYes, 'pulse');

    /* Evolve background */
    evolveBg(idx);

    /* Typewriter question */
    questionEl.style.opacity = '0';
    setTimeout(function () {
      questionEl.style.opacity = '1';
      typewrite(st.q);
    }, 180);

    /* Cross-fade illustration with rotation */
    illusEl.classList.add('switching');
    setTimeout(function () {
      illusEl.innerHTML =
        '<div><span class="scene">' + st.s + '</span><span class="sub-emoji">' + st.e + '</span></div>';
      illusEl.classList.remove('switching');
    }, 350);

    /* Grow YES button + intensify breathing */
    var yesScale = Math.min(1 + noCount * 0.07, 1.38);
    btnYes.style.setProperty('--yes-scale', yesScale);
    btnYes.style.transform = 'scale(' + yesScale + ')';
    btnYes.style.padding = (16 + noCount * 1.5) + 'px ' + (56 + noCount * 6) + 'px';
    btnYes.style.setProperty('--breathe-glow', Math.min(noCount * 10, 40));

    /* Glow ring after 2 No's */
    if (noCount >= 2) glow.classList.add('on');

    /* No counter message */
    var msg = NO_MSGS[Math.min(idx, NO_MSGS.length - 1)] || '';
    if (msg) {
      noCounter.textContent = msg;
      noCounter.classList.add('visible');
    }

    /* Transform NO button */
    if (st.no === null) {
      noCounter.textContent = '';
      noCounter.classList.remove('visible');
      btnNo.classList.add('poof');
      btnNo.addEventListener('animationend', function once() {
        btnNo.style.display = 'none';
        btnNo.removeEventListener('animationend', once);
      });
    } else {
      btnNo.textContent = st.no;
      var s = Math.max(1 - noCount * 0.1, 0.55);
      var o = Math.max(1 - noCount * 0.12, 0.4);
      btnNo.style.fontSize = Math.max(16 - noCount * 1.2, 11) + 'px';
      btnNo.style.opacity = o;

      var dx = noCount >= 2 ? (Math.random() - 0.5) * 80 : 0;
      btnNo.style.transform = 'scale(' + s + ') translateX(' + dx + 'px)';
    }
  }

  /* ────────────────── EMOJI RAIN ────────────────── */
  function spawnDrops() {
    for (var i = 0; i < 5; i++) {
      var el = document.createElement('span');
      el.className = 'drop';
      el.textContent = SAD_EMOJIS[Math.random() * SAD_EMOJIS.length | 0];
      el.style.left = (8 + Math.random() * 84) + '%';
      el.style.top = '-28px';
      el.style.animationDelay = (Math.random() * 0.25) + 's';
      document.body.appendChild(el);
      setTimeout(el.remove.bind(el), 1600);
    }
  }

  /* ────────────────── HELPERS ────────────────── */
  function replayAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /* ────────────────── HEART BURST (on Yes) ────────────────── */
  function launchBurst() {
    var ctx = confettiCvs.getContext('2d');
    var W = confettiCvs.width  = innerWidth;
    var H = confettiCvs.height = innerHeight;
    var cx = W / 2, cy = H / 2;

    var hearts = [];
    var N = 40;
    for (var i = 0; i < N; i++) {
      var angle = (Math.PI * 2 / N) * i + (Math.random() - 0.5) * 0.3;
      var speed = 4 + Math.random() * 8;
      hearts.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 6 + Math.random() * 10,
        opacity: 1,
        decay: 0.015 + Math.random() * 0.01,
        color: ['#ff6b9d','#c9184a','#ff4d6d','#ff85a8','#ffc2d4'][Math.random() * 5 | 0],
        rot: Math.random() * 360,
        rv: (Math.random() - 0.5) * 8,
      });
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);
      var alive = false;
      for (var i = 0; i < hearts.length; i++) {
        var h = hearts[i];
        h.x += h.vx;
        h.y += h.vy;
        h.vy += 0.15;
        h.opacity -= h.decay;
        h.rot += h.rv;
        if (h.opacity <= 0) continue;
        alive = true;
        ctx.globalAlpha = h.opacity;
        drawHeart(ctx, h.x, h.y, h.size, h.color, h.rot);
      }
      ctx.globalAlpha = 1;
      if (alive) requestAnimationFrame(tick);
    }
    tick();
  }

  /* ────────────────── CONFETTI ────────────────── */
  function launchConfetti() {
    var ctx = confettiCvs.getContext('2d');
    var W = confettiCvs.width  = innerWidth;
    var H = confettiCvs.height = innerHeight;

    var COLORS = [
      '#ff6b9d','#c9184a','#ff85a8','#ffc2d4',
      '#ff4d6d','#e63970','#ffffff','#ffd6e0',
      '#ff1744','#ff80ab','#ffcdd2',
      '#ffd700','#ffeb3b','#fff176'
    ];

    var N = Math.min(160, Math.round(W * H / 5000));
    var pieces = [];

    for (var i = 0; i < N; i++) {
      pieces.push({
        x: Math.random() * W,
        y: Math.random() * -H,
        r: 3 + Math.random() * 6,
        c: COLORS[Math.random() * COLORS.length | 0],
        t: Math.random() < 0.35 ? 'h' : (Math.random() < 0.5 ? 'c' : 'r'),
        vy: 1.4 + Math.random() * 2.6,
        vx: (Math.random() - 0.5) * 1.8,
        a: Math.random() * 360,
        va: (Math.random() - 0.5) * 5,
        o: 0.7 + Math.random() * 0.3,
        w: Math.random() * Math.PI * 2,
        ws: 0.018 + Math.random() * 0.025,
      });
    }

    var frame = 0;
    var resizeHandler = function () {
      W = confettiCvs.width  = innerWidth;
      H = confettiCvs.height = innerHeight;
    };
    addEventListener('resize', resizeHandler);

    function tick() {
      ctx.clearRect(0, 0, W, H);
      frame++;
      var alive = false;

      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];
        p.y += p.vy;
        p.x += p.vx + Math.sin(p.w) * 0.4;
        p.w += p.ws;
        p.a += p.va;

        if (p.y < H + 20) alive = true;

        ctx.globalAlpha = p.o;

        if (p.t === 'h') {
          drawHeart(ctx, p.x, p.y, p.r, p.c, p.a);
        } else if (p.t === 'c') {
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.a * Math.PI / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.r * 0.5, -p.r * 0.3, p.r, p.r * 0.55);
          ctx.restore();
        }

        if (frame < 280 && p.y > H + 20) {
          p.y = -10 - Math.random() * 40;
          p.x = Math.random() * W;
        }
      }

      ctx.globalAlpha = 1;
      if (alive || frame < 320) {
        requestAnimationFrame(tick);
      } else {
        removeEventListener('resize', resizeHandler);
      }
    }

    tick();
  }

  /* ────────────────── SPARKLE PARTICLES ────────────────── */
  var sparkleTimer = null;

  function spawnSparkle() {
    var s = document.createElement('span');
    s.className = 'sparkle';
    s.style.left = (8 + Math.random() * 84) + '%';
    s.style.top = (8 + Math.random() * 84) + '%';
    s.style.width = (2 + Math.random() * 3) + 'px';
    s.style.height = s.style.width;
    sparkleContainer.appendChild(s);
    s.addEventListener('animationend', function () { s.remove(); });
    sparkleTimer = setTimeout(spawnSparkle, 400 + Math.random() * 700);
  }

  function stopSparkles() {
    clearTimeout(sparkleTimer);
    sparkleTimer = null;
  }

  /* Start sparkles after card entrance */
  setTimeout(spawnSparkle, 1200);

  /* ────────────────── FIREFLIES / STARS ────────────────── */
  function initFireflies() {
    var count = 18;
    for (var i = 0; i < count; i++) {
      var f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = (Math.random() * 100) + '%';
      f.style.top = (Math.random() * 100) + '%';
      f.style.width = (2 + Math.random() * 3) + 'px';
      f.style.height = f.style.width;

      var dx1 = (Math.random() - 0.5) * 120 + 'px';
      var dy1 = (Math.random() - 0.5) * 120 + 'px';
      var dx2 = (Math.random() - 0.5) * 120 + 'px';
      var dy2 = (Math.random() - 0.5) * 120 + 'px';
      var dx3 = (Math.random() - 0.5) * 120 + 'px';
      var dy3 = (Math.random() - 0.5) * 120 + 'px';
      f.style.setProperty('--dx1', dx1);
      f.style.setProperty('--dy1', dy1);
      f.style.setProperty('--dx2', dx2);
      f.style.setProperty('--dy2', dy2);
      f.style.setProperty('--dx3', dx3);
      f.style.setProperty('--dy3', dy3);

      var driftDuration = (15 + Math.random() * 20) + 's';
      var glowDuration = (2 + Math.random() * 4) + 's';
      f.style.animationDuration = driftDuration + ', ' + glowDuration;
      f.style.animationDelay = (-Math.random() * 20) + 's, ' + (-Math.random() * 4) + 's';

      firefliesEl.appendChild(f);
    }
  }
  initFireflies();

  /* ────────────────── MUSIC ────────────────── */
  var musicPlaying = false;

  function startMusic() {
    bgMusic.src = MUSIC_FILE;
    bgMusic.volume = 0.4;
    var p = bgMusic.play();
    if (p && p.then) {
      p.then(function () {
        musicPlaying = true;
        musicToggle.style.display = 'flex';
        musicToggle.classList.add('playing');
        musicToggle.textContent = '🎵';
      }).catch(function () {
        /* Autoplay blocked — show toggle anyway so user can tap */
        musicToggle.style.display = 'flex';
        musicToggle.textContent = '🔇';
      });
    }
  }

  musicToggle.addEventListener('click', function () {
    if (musicPlaying) {
      bgMusic.pause();
      musicPlaying = false;
      musicToggle.classList.remove('playing');
      musicToggle.textContent = '🔇';
    } else {
      var p = bgMusic.play();
      if (p && p.then) {
        p.then(function () {
          musicPlaying = true;
          musicToggle.classList.add('playing');
          musicToggle.textContent = '🎵';
        }).catch(function () {});
      }
    }
  });

  /* ────────────────── GALLERY ────────────────── */
  function initGallery() {
    if (GALLERY_PHOTOS.length === 0) return;

    /* Build slides */
    for (var i = 0; i < GALLERY_PHOTOS.length; i++) {
      var photo = GALLERY_PHOTOS[i];
      var slide = document.createElement('div');
      slide.className = 'gallery-slide';

      var img = document.createElement('img');
      img.src = photo.src;
      img.alt = photo.caption || '';
      img.onerror = function () { this.style.display = 'none'; };
      slide.appendChild(img);

      if (photo.caption) {
        var cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = photo.caption;
        slide.appendChild(cap);
      }

      galleryTrack.appendChild(slide);

      var dot = document.createElement('button');
      dot.className = 'gallery-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Foto ' + (i + 1));
      (function (index) {
        dot.addEventListener('click', function () {
          galleryTrack.children[index].scrollIntoView({ behavior: 'smooth', inline: 'center' });
        });
      })(i);
      galleryDots.appendChild(dot);
    }

    /* Update dots on scroll */
    galleryTrack.addEventListener('scroll', function () {
      var scrollLeft = galleryTrack.scrollLeft;
      var slideWidth = galleryTrack.offsetWidth;
      var activeIndex = Math.round(scrollLeft / slideWidth);
      var dots = galleryDots.querySelectorAll('.gallery-dot');
      for (var d = 0; d < dots.length; d++) {
        dots[d].classList.toggle('active', d === activeIndex);
      }
    });

    /* Show gallery buttons */
    btnGalleryVideo.style.display = '';
    btnGallerySuccess.style.display = '';
  }

  function openGallery() {
    galleryOverlay.classList.add('active');
  }

  function closeGallery() {
    galleryOverlay.classList.remove('active');
  }

  btnGalleryVideo.addEventListener('click', openGallery);
  btnGallerySuccess.addEventListener('click', openGallery);
  galleryClose.addEventListener('click', closeGallery);

  initGallery();

  /* ────────────────── EASTER EGG ────────────────── */
  var easterTaps = 0;
  var easterDone = false;

  successHeart.addEventListener('click', function () {
    if (easterDone) return;
    easterTaps++;

    /* Small pulse feedback */
    replayAnim(successHeart, 'mega-pulse');

    if (easterTaps >= 5) {
      easterDone = true;
      easterMsg.textContent = EASTER_EGG_MSG;
      easterMsg.classList.add('visible');

      /* Extra heart burst */
      launchBurst();

      if (navigator.vibrate) navigator.vibrate([60, 30, 60, 30, 120]);
    }
  });

})();
</script>
