<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffc2d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Per Te ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-deep: #c9184a;
      --pink-mid: #e63970;
      --pink-light: #ff85a8;
      --pink-pale: #ffc2d4;
      --pink-cloud: #ffe0ec;
      --pink-glow: rgba(230, 57, 112, 0.4);
      --white-glass: rgba(255, 255, 255, 0.88);
      --radius-card: 28px;
      --radius-btn: 50px;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      /* Background evolution colors */
      --bg-1: #ffe0ec;
      --bg-2: #ffc2d4;
      --bg-3: #ffb3c6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', system-ui, sans-serif;
      position: relative;
      padding: var(--safe-top) 0 var(--safe-bottom);
    }

    /* ── Animated gradient background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-1));
      background-size: 300% 300%;
      animation: gradientShift 12s ease infinite;
      transition: --bg-1 0.8s, --bg-2 0.8s, --bg-3 0.8s;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Floating hearts (CSS-only) ── */
    .hearts-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .hearts-bg span {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      will-change: transform, opacity;
      animation: floatHeart linear infinite;
    }

    @keyframes floatHeart {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.18; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(-105vh) rotate(270deg); opacity: 0; }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 2;
      background: var(--white-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: var(--radius-card);
      padding: 36px 24px 32px;
      width: min(88vw, 380px);
      text-align: center;
      box-shadow:
        0 24px 48px rgba(180, 60, 100, 0.15),
        0 4px 12px rgba(180, 60, 100, 0.08);
      transition: transform 0.4s var(--ease-smooth), box-shadow 0.4s;
      /* Base visible state */
      opacity: 1;
      /* Gyroscope tilt perspective */
      transform-style: preserve-3d;
    }

    /* Entrance: applied initially, removed by JS after animation ends */
    .card.entering {
      opacity: 0;
      transform: translateY(40px) scale(0.92);
      animation: cardEntrance 0.8s var(--ease-bounce) 0.3s forwards;
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card.shake {
      animation: shake 0.45s var(--ease-smooth);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      15%  { transform: translateX(-6px) rotate(-1.5deg); }
      30%  { transform: translateX(6px) rotate(1.5deg); }
      50%  { transform: translateX(-4px) rotate(-0.8deg); }
      70%  { transform: translateX(4px) rotate(0.8deg); }
      85%  { transform: translateX(-2px) rotate(-0.3deg); }
    }

    /* ── Question ── */
    .question {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 700;
      color: var(--pink-deep);
      line-height: 1.25;
      margin-bottom: 20px;
      min-height: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    /* Typewriter cursor */
    .question.typing::after {
      content: '|';
      display: inline-block;
      margin-left: 2px;
      animation: blink 0.5s step-end infinite;
      color: var(--pink-mid);
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ── Illustration ── */
    .illustration {
      margin-bottom: 24px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: opacity 0.35s, transform 0.35s var(--ease-bounce);
    }

    .illustration .scene {
      font-size: clamp(64px, 18vw, 86px);
      display: inline-block;
      animation: gentleBob 2.4s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-6px) scale(1.03); }
    }

    .illustration .sub-emoji {
      font-size: clamp(22px, 6vw, 30px);
      display: block;
      margin-top: 2px;
      opacity: 0.85;
    }

    /* ── Buttons container ── */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      position: relative;
    }

    /* ── Shared button styles ── */
    .btn {
      border: none;
      border-radius: var(--radius-btn);
      font-family: 'Nunito', system-ui, sans-serif;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
      outline: none;
      transition:
        transform 0.25s var(--ease-bounce),
        box-shadow 0.25s var(--ease-smooth),
        background 0.25s,
        padding 0.35s var(--ease-smooth),
        opacity 0.3s;
    }

    /* Ripple shared */
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--rx, 50%) var(--ry, 50%), rgba(255,255,255,0.45) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .btn:active::before { opacity: 1; }

    /* ── YES button ── */
    .btn-yes {
      background: linear-gradient(135deg, var(--pink-mid), var(--pink-deep));
      color: #fff;
      font-size: clamp(18px, 5vw, 22px);
      padding: 16px 56px;
      min-height: 54px;
      min-width: 180px;
      letter-spacing: 0.3px;
      box-shadow:
        0 6px 20px var(--pink-glow),
        0 2px 6px rgba(201, 24, 74, 0.2);
      z-index: 1;
      /* Breathing pulse */
      animation: breathe 2.5s ease-in-out infinite;
    }

    /* Breathing pulse - intensifies via --breathe-intensity */
    @keyframes breathe {
      0%, 100% { box-shadow: 0 6px 20px var(--pink-glow), 0 2px 6px rgba(201,24,74,0.2); }
      50%  { box-shadow: 0 6px 30px var(--pink-glow), 0 2px 8px rgba(201,24,74,0.3), 0 0 calc(var(--breathe-glow, 0) * 1px) var(--pink-light); }
    }

    .btn-yes:active {
      transform: scale(0.94) !important;
      box-shadow: 0 2px 10px var(--pink-glow);
    }

    /* Glow ring */
    .btn-yes .glow {
      position: absolute;
      inset: -3px;
      border-radius: var(--radius-btn);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      background: conic-gradient(from 0deg, transparent 0%, var(--pink-light) 25%, transparent 50%, var(--pink-mid) 75%, transparent 100%);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      padding: 2.5px;
    }

    .btn-yes .glow.on {
      opacity: 1;
      animation: glowSpin 2.5s linear infinite;
    }

    @keyframes glowSpin { to { transform: rotate(360deg); } }

    /* Yes pulse after No click */
    .btn-yes.pulse {
      animation: yesPulse 0.5s var(--ease-bounce);
    }

    @keyframes yesPulse {
      0%   { transform: scale(var(--yes-scale, 1)); }
      40%  { transform: scale(calc(var(--yes-scale, 1) * 1.1)); }
      100% { transform: scale(var(--yes-scale, 1)); }
    }

    /* ── NO button ── */
    .btn-no {
      background: rgba(0, 0, 0, 0.06);
      color: #a0a0a0;
      font-size: clamp(14px, 3.8vw, 16px);
      padding: 12px 44px;
      min-height: 46px;
      font-weight: 700;
      transition:
        transform 0.35s var(--ease-bounce),
        box-shadow 0.25s,
        background 0.25s,
        padding 0.35s var(--ease-smooth),
        opacity 0.3s,
        font-size 0.35s;
    }

    .btn-no:active {
      transform: scale(0.92);
      background: rgba(0, 0, 0, 0.1);
    }

    .btn-no.poof {
      animation: poof 0.55s var(--ease-smooth) forwards;
    }

    @keyframes poof {
      0%   { transform: scale(1) rotate(0); opacity: 1; }
      40%  { transform: scale(1.15) rotate(6deg); opacity: 0.6; }
      100% { transform: scale(0) rotate(25deg); opacity: 0; }
    }

    /* ── No counter badge ── */
    .no-counter {
      font-size: 13px;
      color: var(--pink-mid);
      opacity: 0;
      margin-top: 4px;
      transition: opacity 0.4s;
      min-height: 20px;
    }

    .no-counter.visible {
      opacity: 1;
      animation: fadeSlideUp 0.4s var(--ease-bounce);
    }

    /* ── Emoji rain drops ── */
    .drop {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      font-size: 22px;
      will-change: transform, opacity;
      animation: emojiDrop 1.3s ease-in forwards;
    }

    @keyframes emojiDrop {
      0%   { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(92vh) rotate(300deg); opacity: 0; }
    }

    /* ── FLASH overlay on Yes ── */
    .flash {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    .flash.bang {
      animation: flashBang 0.5s ease-out forwards;
    }

    @keyframes flashBang {
      0%   { opacity: 0.95; }
      100% { opacity: 0; }
    }

    /* ── VIDEO OVERLAY ── */
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .video-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .video-overlay video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    .video-overlay .video-msg {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      padding: 32px 24px calc(32px + var(--safe-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease 1.2s, transform 0.6s var(--ease-bounce) 1.2s;
    }

    .video-overlay.active .video-msg {
      opacity: 1;
      transform: translateY(0);
    }

    .video-msg h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(28px, 7.5vw, 40px);
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      margin-bottom: 6px;
    }

    .video-msg p {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(15px, 4vw, 18px);
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
      line-height: 1.45;
    }

    .video-msg .infinity {
      display: inline-block;
      margin-top: 12px;
      font-size: clamp(12px, 3.2vw, 14px);
      opacity: 0.75;
      color: #fff;
      animation: fadeSlideUp 0.6s ease 2s both;
    }

    /* ── SUCCESS SCREEN (fallback if no video) ── */
    .success-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .success-screen .bg-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, var(--pink-cloud), var(--pink-pale), #ffb3c6);
    }

    .success-screen.active {
      opacity: 1;
      pointer-events: all;
    }

    .success-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px;
      transform: scale(0.7);
      opacity: 0;
      transition: transform 0.7s var(--ease-bounce) 0.3s, opacity 0.5s ease 0.3s;
    }

    .success-screen.active .success-content {
      transform: scale(1);
      opacity: 1;
    }

    .success-heart {
      font-size: clamp(80px, 22vw, 110px);
      display: inline-block;
      animation: heartbeat 1.1s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%  { transform: scale(1.18); }
      28%  { transform: scale(0.98); }
      42%  { transform: scale(1.12); }
      56%  { transform: scale(1); }
    }

    .success-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 700;
      color: var(--pink-deep);
      margin: 16px 0 10px;
      animation: fadeSlideUp 0.6s ease 0.6s both;
    }

    .success-subtitle {
      font-size: clamp(16px, 4.5vw, 19px);
      color: #d44a6a;
      line-height: 1.55;
      animation: fadeSlideUp 0.6s ease 0.95s both;
    }

    .success-subtitle .infinity {
      display: inline-block;
      margin-top: 14px;
      font-size: clamp(13px, 3.5vw, 15px);
      opacity: 0.65;
      animation: fadeSlideUp 0.6s ease 1.4s both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Confetti + burst canvas ── */
    #confetti {
      position: fixed;
      inset: 0;
      z-index: 300;
      pointer-events: none;
    }

    /* ── A11y ── */
    .btn:focus-visible {
      outline: 3px solid var(--pink-mid);
      outline-offset: 3px;
    }
  </style>
</head>
<body>

<!-- Animated gradient BG -->
<div class="bg" id="bg"></div>

<!-- Floating hearts (pure CSS, 12 elements) -->
<div class="hearts-bg" aria-hidden="true">
  <span style="left:5%;font-size:16px;animation-duration:11s;animation-delay:0s">♥</span>
  <span style="left:12%;font-size:12px;animation-duration:14s;animation-delay:2s">♡</span>
  <span style="left:22%;font-size:18px;animation-duration:10s;animation-delay:4s">❤</span>
  <span style="left:33%;font-size:14px;animation-duration:13s;animation-delay:1s">💕</span>
  <span style="left:42%;font-size:10px;animation-duration:15s;animation-delay:6s">♥</span>
  <span style="left:55%;font-size:16px;animation-duration:12s;animation-delay:3s">💗</span>
  <span style="left:64%;font-size:13px;animation-duration:14s;animation-delay:5s">♡</span>
  <span style="left:74%;font-size:17px;animation-duration:11s;animation-delay:0.5s">❤</span>
  <span style="left:82%;font-size:11px;animation-duration:16s;animation-delay:7s">💕</span>
  <span style="left:90%;font-size:15px;animation-duration:13s;animation-delay:2.5s">♥</span>
  <span style="left:48%;font-size:9px;animation-duration:17s;animation-delay:8s">💗</span>
  <span style="left:18%;font-size:14px;animation-duration:12s;animation-delay:9s">♡</span>
</div>

<!-- Main card -->
<main class="card entering" id="card" role="main">
  <div class="question" id="question" aria-live="polite">
    Vuoi essere la mia Valentina? 💕
  </div>

  <div class="illustration" id="illustration" aria-hidden="true">
    <div>
      <span class="scene">🥺👉👈</span>
      <span class="sub-emoji">💝</span>
    </div>
  </div>

  <div class="buttons" id="buttonsArea">
    <button class="btn btn-yes" id="btnYes" aria-label="Sì, voglio essere la tua Valentina">
      Sì! 💖
      <span class="glow" id="glow"></span>
    </button>
    <button class="btn btn-no" id="btnNo" aria-label="No">
      No...
    </button>
    <div class="no-counter" id="noCounter" aria-live="polite"></div>
  </div>
</main>

<!-- Flash overlay -->
<div class="flash" id="flash"></div>

<!-- Video overlay -->
<div class="video-overlay" id="videoOverlay">
  <video id="heroVideo" playsinline muted loop preload="none">
    <source src="video.mp4" type="video/mp4">
  </video>
  <div class="video-msg">
    <h2>Lo sapevo! 🥰</h2>
    <p>Sei la cosa più bella<br>che mi sia mai capitata.</p>
    <span class="infinity">Ti amo ∞</span>
  </div>
</div>

<!-- Success screen (fallback) -->
<div class="success-screen" id="successScreen">
  <div class="bg-fill"></div>
  <div class="success-content">
    <div class="success-heart">💖</div>
    <h2 class="success-title">Lo sapevo! 🥰</h2>
    <p class="success-subtitle">
      Sei la cosa più bella<br>che mi sia mai capitata.
      <span class="infinity">Ti amo ∞</span>
    </p>
  </div>
</div>

<!-- Confetti + burst canvas -->
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';

  /* ────────────────── STAGE DATA ────────────────── */
  const STAGES = [
    { q: 'Vuoi essere la mia Valentina? 💕', s: '🥺👉👈',  e: '💝', no: 'No...' },
    { q: 'Sicura sicura? 🥹',                s: '🐻💔',    e: '😢', no: 'Ehm... no' },
    { q: 'Dai ripensaci... 🥺',              s: '🧸🌹',    e: '🥀', no: 'No, dai...' },
    { q: 'Ti prego... guardami! 🥺',         s: '🐶🥺',    e: '🫶', no: 'Noo...' },
    { q: 'Non mi arrendo mai! 💪❤️',         s: '🧎‍♂️💍',  e: '✨', no: '...' },
    { q: "L'unica risposta è SÌ! 😏💖",     s: '💃🕺💖',  e: '🎯', no: null },
  ];

  const SAD_EMOJIS = ['💔', '😢', '🥺', '😿', '💧'];

  /* No-counter messages */
  const NO_MSGS = [
    '', '',
    'Hai detto no 2 volte... 😤',
    'Ancora?! Già 3... 🥺',
    '4 no?! Cuore di pietra! 💔',
    '',
  ];

  /* Background evolution per stage */
  const BG_STAGES = [
    ['#ffe0ec', '#ffc2d4', '#ffb3c6'],
    ['#ffd6e6', '#ffb8cc', '#ffa8ba'],
    ['#ffcce0', '#ffaabe', '#ff96af'],
    ['#ffc0d8', '#ff99b5', '#ff85a8'],
    ['#ffb0cc', '#ff80a8', '#ff6b9d'],
    ['#ffa0c0', '#ff6b9d', '#ff4d6d'],
  ];

  /* ────────────────── DOM REFS ────────────────── */
  const $ = (id) => document.getElementById(id);
  const card         = $('card');
  const questionEl   = $('question');
  const illusEl      = $('illustration');
  const btnYes       = $('btnYes');
  const btnNo        = $('btnNo');
  const glow         = $('glow');
  const noCounter    = $('noCounter');
  const bgEl         = $('bg');
  const flashEl      = $('flash');
  const videoOverlay = $('videoOverlay');
  const heroVideo    = $('heroVideo');
  const successScr   = $('successScreen');
  const confettiCvs  = $('confetti');

  let noCount = 0;
  let done    = false;

  /* ────────────────── RIPPLE TRACKING ────────────────── */
  function trackPointer(e) {
    const btn = e.currentTarget;
    const r = btn.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    btn.style.setProperty('--rx', ((cx - r.left) / r.width * 100) + '%');
    btn.style.setProperty('--ry', ((cy - r.top) / r.height * 100) + '%');
  }
  btnYes.addEventListener('pointerdown', trackPointer);
  btnNo.addEventListener('pointerdown', trackPointer);

  /* ────────────────── CARD ENTRANCE ────────────────── */
  card.addEventListener('animationend', function (e) {
    if (e.animationName === 'cardEntrance') {
      card.classList.remove('entering');
    }
  });

  /* ────────────────── GYROSCOPE TILT ────────────────── */
  function initGyro() {
    let tiltX = 0, tiltY = 0;

    function onOrientation(e) {
      const g = e.gamma || 0;  /* left/right tilt -90..90 */
      const b = e.beta  || 0;  /* front/back tilt -180..180 */
      tiltY = Math.max(-5, Math.min(5, g * 0.12));
      tiltX = Math.max(-5, Math.min(5, (b - 45) * 0.1));
      card.style.transform = 'perspective(800px) rotateX(' + (-tiltX) + 'deg) rotateY(' + tiltY + 'deg)';
    }

    /* iOS 13+ requires permission */
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      /* Will be triggered on first user tap */
      document.addEventListener('click', function reqGyro() {
        DeviceOrientationEvent.requestPermission()
          .then(function (state) {
            if (state === 'granted') window.addEventListener('deviceorientation', onOrientation);
          })
          .catch(function () {});
        document.removeEventListener('click', reqGyro);
      }, { once: true });
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      window.addEventListener('deviceorientation', onOrientation);
    }
  }
  initGyro();

  /* ────────────────── TYPEWRITER ────────────────── */
  function typewrite(text, cb) {
    questionEl.textContent = '';
    questionEl.classList.add('typing');
    let i = 0;
    function next() {
      if (i < text.length) {
        questionEl.textContent += text[i++];
        setTimeout(next, 30 + Math.random() * 20);
      } else {
        questionEl.classList.remove('typing');
        if (cb) cb();
      }
    }
    next();
  }

  /* ────────────────── BACKGROUND EVOLUTION ────────────────── */
  function evolveBg(idx) {
    const c = BG_STAGES[Math.min(idx, BG_STAGES.length - 1)];
    bgEl.style.setProperty('--bg-1', c[0]);
    bgEl.style.setProperty('--bg-2', c[1]);
    bgEl.style.setProperty('--bg-3', c[2]);
  }

  /* ────────────────── HANDLE YES ────────────────── */
  btnYes.addEventListener('click', handleYes);

  function handleYes() {
    if (done) return;
    done = true;

    if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 80]);

    /* 1. Flash */
    flashEl.classList.add('bang');

    /* 2. Heart burst */
    launchBurst();

    /* 3. After flash, show video or fallback */
    setTimeout(function () {
      heroVideo.src = 'video.mp4';
      heroVideo.load();
      var p = heroVideo.play();
      if (p && p.then) {
        p.then(showVideo).catch(showFallback);
      } else {
        showFallback();
      }
    }, 300);
  }

  function showVideo() {
    videoOverlay.classList.add('active');
    setTimeout(launchConfetti, 400);
  }

  function showFallback() {
    heroVideo.pause();
    heroVideo.removeAttribute('src');
    heroVideo.load();
    successScr.classList.add('active');
    setTimeout(launchConfetti, 400);
  }

  /* ────────────────── HANDLE NO ────────────────── */
  btnNo.addEventListener('click', handleNo);

  function handleNo() {
    if (done) return;
    noCount++;

    const idx = Math.min(noCount, STAGES.length - 1);
    const st  = STAGES[idx];

    /* Shake card */
    replayAnim(card, 'shake');

    /* Sad emoji rain */
    spawnDrops();

    /* Pulse yes */
    replayAnim(btnYes, 'pulse');

    /* Evolve background */
    evolveBg(idx);

    /* Typewriter question */
    questionEl.style.opacity = '0';
    setTimeout(function () {
      questionEl.style.opacity = '1';
      typewrite(st.q);
    }, 180);

    /* Cross-fade illustration */
    illusEl.style.opacity = '0';
    illusEl.style.transform = 'scale(0.85)';
    setTimeout(function () {
      illusEl.innerHTML =
        '<div><span class="scene">' + st.s + '</span><span class="sub-emoji">' + st.e + '</span></div>';
      illusEl.style.opacity = '1';
      illusEl.style.transform = 'scale(1)';
    }, 250);

    /* Grow YES button + intensify breathing */
    var yesScale = Math.min(1 + noCount * 0.07, 1.38);
    btnYes.style.setProperty('--yes-scale', yesScale);
    btnYes.style.transform = 'scale(' + yesScale + ')';
    btnYes.style.padding = (16 + noCount * 1.5) + 'px ' + (56 + noCount * 6) + 'px';
    btnYes.style.setProperty('--breathe-glow', Math.min(noCount * 10, 40));

    /* Glow ring after 2 No's */
    if (noCount >= 2) glow.classList.add('on');

    /* No counter message */
    var msg = NO_MSGS[Math.min(idx, NO_MSGS.length - 1)] || '';
    if (msg) {
      noCounter.textContent = msg;
      noCounter.classList.add('visible');
    }

    /* Transform NO button */
    if (st.no === null) {
      /* Final stage — poof away */
      noCounter.textContent = '';
      noCounter.classList.remove('visible');
      btnNo.classList.add('poof');
      btnNo.addEventListener('animationend', function once() {
        btnNo.style.display = 'none';
        btnNo.removeEventListener('animationend', once);
      });
    } else {
      btnNo.textContent = st.no;
      var s = Math.max(1 - noCount * 0.1, 0.55);
      var o = Math.max(1 - noCount * 0.12, 0.4);
      btnNo.style.fontSize = Math.max(16 - noCount * 1.2, 11) + 'px';
      btnNo.style.opacity = o;

      /* Shrink + random horizontal shift */
      var dx = noCount >= 2 ? (Math.random() - 0.5) * 80 : 0;
      btnNo.style.transform = 'scale(' + s + ') translateX(' + dx + 'px)';
    }
  }

  /* ────────────────── EMOJI RAIN ────────────────── */
  function spawnDrops() {
    for (var i = 0; i < 5; i++) {
      var el = document.createElement('span');
      el.className = 'drop';
      el.textContent = SAD_EMOJIS[Math.random() * SAD_EMOJIS.length | 0];
      el.style.left = (8 + Math.random() * 84) + '%';
      el.style.top = '-28px';
      el.style.animationDelay = (Math.random() * 0.25) + 's';
      document.body.appendChild(el);
      setTimeout(el.remove.bind(el), 1600);
    }
  }

  /* ────────────────── HELPERS ────────────────── */
  function replayAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /* ────────────────── HEART BURST (on Yes) ────────────────── */
  function launchBurst() {
    var ctx = confettiCvs.getContext('2d');
    var W = confettiCvs.width  = innerWidth;
    var H = confettiCvs.height = innerHeight;
    var cx = W / 2, cy = H / 2;

    var hearts = [];
    var N = 40;
    for (var i = 0; i < N; i++) {
      var angle = (Math.PI * 2 / N) * i + (Math.random() - 0.5) * 0.3;
      var speed = 4 + Math.random() * 8;
      hearts.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 6 + Math.random() * 10,
        opacity: 1,
        decay: 0.015 + Math.random() * 0.01,
        color: ['#ff6b9d','#c9184a','#ff4d6d','#ff85a8','#ffc2d4'][Math.random() * 5 | 0],
        rot: Math.random() * 360,
        rv: (Math.random() - 0.5) * 8,
      });
    }

    function drawHeart(x, y, sz, color, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.fillStyle = color;
      ctx.beginPath();
      var s = sz * 0.5;
      ctx.moveTo(0, s * 0.4);
      ctx.bezierCurveTo(-s, -s * 0.5, -s * 2, s * 0.3, 0, s * 1.5);
      ctx.bezierCurveTo(s * 2, s * 0.3, s, -s * 0.5, 0, s * 0.4);
      ctx.fill();
      ctx.restore();
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);
      var alive = false;
      for (var i = 0; i < hearts.length; i++) {
        var h = hearts[i];
        h.x += h.vx;
        h.y += h.vy;
        h.vy += 0.15; /* gravity */
        h.opacity -= h.decay;
        h.rot += h.rv;
        if (h.opacity <= 0) continue;
        alive = true;
        ctx.globalAlpha = h.opacity;
        drawHeart(h.x, h.y, h.size, h.color, h.rot);
      }
      ctx.globalAlpha = 1;
      if (alive) requestAnimationFrame(tick);
    }
    tick();
  }

  /* ────────────────── CONFETTI ────────────────── */
  function launchConfetti() {
    var ctx = confettiCvs.getContext('2d');
    var W = confettiCvs.width  = innerWidth;
    var H = confettiCvs.height = innerHeight;

    var COLORS = [
      '#ff6b9d','#c9184a','#ff85a8','#ffc2d4',
      '#ff4d6d','#e63970','#ffffff','#ffd6e0',
      '#ff1744','#ff80ab','#ffcdd2'
    ];

    var N = Math.min(160, Math.round(W * H / 5000));
    var pieces = [];

    for (var i = 0; i < N; i++) {
      pieces.push({
        x: Math.random() * W,
        y: Math.random() * -H,
        r: 3 + Math.random() * 6,
        c: COLORS[Math.random() * COLORS.length | 0],
        t: Math.random() < 0.35 ? 'h' : (Math.random() < 0.5 ? 'c' : 'r'),
        vy: 1.4 + Math.random() * 2.6,
        vx: (Math.random() - 0.5) * 1.8,
        a: Math.random() * 360,
        va: (Math.random() - 0.5) * 5,
        o: 0.7 + Math.random() * 0.3,
        w: Math.random() * Math.PI * 2,
        ws: 0.018 + Math.random() * 0.025,
      });
    }

    var frame = 0;

    function drawHeart(x, y, sz, color, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.fillStyle = color;
      ctx.beginPath();
      var s = sz * 0.5;
      ctx.moveTo(0, s * 0.4);
      ctx.bezierCurveTo(-s, -s * 0.5, -s * 2, s * 0.3, 0, s * 1.5);
      ctx.bezierCurveTo(s * 2, s * 0.3, s, -s * 0.5, 0, s * 0.4);
      ctx.fill();
      ctx.restore();
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);
      frame++;
      var alive = false;

      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];
        p.y += p.vy;
        p.x += p.vx + Math.sin(p.w) * 0.4;
        p.w += p.ws;
        p.a += p.va;

        if (p.y < H + 20) alive = true;

        ctx.globalAlpha = p.o;

        if (p.t === 'h') {
          drawHeart(p.x, p.y, p.r, p.c, p.a);
        } else if (p.t === 'c') {
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.a * Math.PI / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.r * 0.5, -p.r * 0.3, p.r, p.r * 0.55);
          ctx.restore();
        }

        if (frame < 280 && p.y > H + 20) {
          p.y = -10 - Math.random() * 40;
          p.x = Math.random() * W;
        }
      }

      ctx.globalAlpha = 1;
      if (alive || frame < 320) requestAnimationFrame(tick);
    }

    tick();

    addEventListener('resize', function () {
      W = confettiCvs.width  = innerWidth;
      H = confettiCvs.height = innerHeight;
    });
  }

})();
</script>
</body>
